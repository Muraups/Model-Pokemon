<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>Pokédex</h1>
    
    <!-- Lista de Pokémons -->
    <h2>Lista de Pokémons</h2>
    <ul id="pokemon-list"></ul>

    <!-- Formulário para adicionar Pokémon -->
    <h2>Adicionar Novo Pokémon</h2>
    <form id="pokemon-form">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>
        
        <label for="tipo">Tipo:</label>
        <select id="tipo" name="tipo" required>
            <option value="">Selecione o tipo</option>
            <option value="Normal">Normal</option>
            <option value="Fogo">Fogo</option>
            <option value="Água">Água</option>
            <option value="Elétrico">Elétrico</option>
            <option value="Grama">Grama</option>
            <option value="Gelo">Gelo</option>
            <option value="Lutador">Lutador</option>
            <option value="Venenoso">Venenoso</option>
            <option value="Terrestre">Terrestre</option>
            <option value="Voador">Voador</option>
            <option value="Psíquico">Psíquico</option>
            <option value="Inseto">Inseto</option>
            <option value="Pedra">Pedra</option>
            <option value="Fantasma">Fantasma</option>
            <option value="Dragão">Dragão</option>
            <option value="Sombrio">Sombrio</option>
            <option value="Aço">Aço</option>
            <option value="Fada">Fada</option>
        </select>

        <label for="altura">Altura:</label>
        <input type="number" id="altura" name="altura" required>

        <label for="peso">Peso:</label>
        <input type="number" id="peso" name="peso" required>

        <label for="nivelDePoder">Nível de Poder:</label>
        <input type="number" id="nivelDePoder" name="nivelDePoder" required>
        
        <button type="submit">Adicionar Pokémon</button>
    </form>

    <script src="js/script.js"></script>
</body>
</html>
